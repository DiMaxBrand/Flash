name: Build & Release APK

# Manual only: a release is made when you run this workflow by hand (Actions tab, Run workflow).
# The title and description are optional; without a title the release is named "Flash <version>".
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Release title (optional, default: "Flash <version>"). Short changelog headline.'
        required: false
        type: string
      description:
        description: 'Release description (optional, shown above the commit notes).'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      INPUT_TITLE: ${{ inputs.title }}
      INPUT_DESCRIPTION: ${{ inputs.description }}
      # The signing key lives in GitHub Actions secrets (Settings > Secrets and variables > Actions):
      #   KEYSTORE_BASE64    the .jks file, base64-encoded (e.g. `base64 -w0 flash.jks`)
      #   KEYSTORE_PASSWORD  the keystore password
      #   KEY_ALIAS          the key alias
      #   KEY_PASSWORD       the key password
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      # No signing key, no release: an unsigned or debug-signed build must never be published.
      - name: Check for the signing key
        id: key
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
            echo "::notice::No signing key secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are set, so nothing was built or released."
          fi

      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4.1.7

      - name: Set up JDK 21
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        if: steps.key.outputs.present == 'true'
        run: chmod +x gradlew

      - name: Restore the signing key
        if: steps.key.outputs.present == 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/flash-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/flash-release.jks" >> $GITHUB_ENV

      # The release comes entirely from build.gradle.kts: appVersionName is the tag and the release
      # is a pre-release when it has a -beta.N suffix (no branch rules). Stable is plain X.Y.Z.
      - name: Read the version from the build
        if: steps.key.outputs.present == 'true'
        id: version
        run: |
          VERSION=$(./gradlew -q printVersionName --no-daemon)
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
          TITLE="${INPUT_TITLE:-Flash ${VERSION}}"
          echo "name=${TITLE}" >> $GITHUB_OUTPUT
          # Release notes (the update sheet shows them as "What's new"): the optional description,
          # then the commit message without the trailer lines
          {
            echo "body<<RELEASE_NOTES_EOF"
            if [ -n "$INPUT_DESCRIPTION" ]; then
              echo "$INPUT_DESCRIPTION"
              echo
            fi
            git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' || true
            echo
            echo "Build ${VERSION} from commit ${GITHUB_SHA::7}."
            echo "RELEASE_NOTES_EOF"
          } >> $GITHUB_OUTPUT

      - name: Build APK (signed with the release key)
        if: steps.key.outputs.present == 'true'
        run: ./gradlew assembleRelease --no-daemon

      - name: Create Release & upload APK
        if: steps.key.outputs.present == 'true'
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: ${{ steps.version.outputs.body }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: ${{ steps.version.outputs.prerelease == 'false' }}
