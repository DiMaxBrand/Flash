name: Build & Release APK

on:
  push:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The signing key lives in GitHub Actions secrets (Settings > Secrets and variables > Actions):
      #   KEYSTORE_BASE64    the .jks file, base64-encoded (e.g. `base64 -w0 flash.jks`)
      #   KEYSTORE_PASSWORD  the keystore password
      #   KEY_ALIAS          the key alias
      #   KEY_PASSWORD       the key password
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      # No signing key, no release: an unsigned or debug-signed build must never be published.
      - name: Check for the signing key
        id: key
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
            echo "::notice::No signing key secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are set, so nothing was built or released."
          fi

      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4.1.7

      - name: Set up JDK 21
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        if: steps.key.outputs.present == 'true'
        run: chmod +x gradlew

      - name: Restore the signing key
        if: steps.key.outputs.present == 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/flash-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/flash-release.jks" >> $GITHUB_ENV

      # Opens the keystore with the stored passwords and prints the PUBLIC certificate details (owner,
      # validity, fingerprint), never a password. Compare the fingerprint with your own copy of the
      # key (`keytool -list -v -keystore yourkey.jks`) to be sure the secrets hold the right key.
      - name: Check the signing key
        if: steps.key.outputs.present == 'true'
        run: |
          if ! keytool -list -v -keystore "$RUNNER_TEMP/flash-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/key-info.txt" 2>&1; then
            echo "::error::Could not open the keystore with KEYSTORE_PASSWORD and KEY_ALIAS. Check KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS."
            exit 1
          fi
          grep -E "Alias name|Owner:|Valid from|SHA256:" "$RUNNER_TEMP/key-info.txt"

      # main = "confirmed to work" = the stable channel; everything else (develop) = the beta channel.
      # The in-app updater compares these tags: X.Y.Z (stable) and X.Y.Z-beta.<versionCode> (beta).
      - name: Release channel
        if: steps.key.outputs.present == 'true'
        id: channel
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "name=stable" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "name=beta" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Build APK (signed with the release key)
        if: steps.key.outputs.present == 'true'
        run: ./gradlew assembleDebug -PreleaseChannel=${{ steps.channel.outputs.name }} --no-daemon

      # Proves the APK really carries the release key (this also fails if KEY_PASSWORD was wrong)
      - name: Show the APK's signing certificate
        if: steps.key.outputs.present == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "certificate DN|SHA-256"

      - name: Get version name
        if: steps.key.outputs.present == 'true'
        id: version
        run: |
          VERSION=$(./gradlew -q printVersionName --no-daemon)
          TAG=$(./gradlew -q printUpdateTag -PreleaseChannel=${{ steps.channel.outputs.name }} --no-daemon)
          # "0.12.0-updater, Oct 18" -> "updater"
          SHORT_NAME=$(echo "$VERSION" | sed -E 's/^[0-9.]+-?//; s/, .*$//')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=Flash ${TAG}: ${SHORT_NAME}" >> $GITHUB_OUTPUT
          # The release notes the update sheet shows: the commit message without the trailer lines
          {
            echo "body<<RELEASE_NOTES_EOF"
            git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' || true
            echo
            echo "Build ${VERSION} from commit ${GITHUB_SHA::7}."
            echo "RELEASE_NOTES_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release & upload APK
        if: steps.key.outputs.present == 'true'
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: ${{ steps.version.outputs.body }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: ${{ steps.channel.outputs.prerelease == 'false' }}
